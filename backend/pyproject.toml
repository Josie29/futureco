[project]
name = "futureco-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # 0.116 is the floor for `beta_tool` + `messages.tool_runner`, which the
    # copilot's retrieval loop uses. The generator's extractor needs only 0.75.
    "anthropic>=0.116",
    "fastapi>=0.120",
    "fastembed>=0.8.0",
    "neo4j>=5.28",
    "numpy>=2.5.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "rapidfuzz>=3.14.5",
    "uvicorn>=0.38",
]

[tool.uv]
# Source is a flat tree under src/, not an installable package. Run modules with
# `PYTHONPATH=src uv run python -m graph.build.main`.
package = false

[tool.ruff]
line-length = 100
src = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# src/ is a flat namespace-package tree, so pytest needs it on the path and the
# importlib import mode to find modules without __init__.py files.
pythonpath = ["src"]
addopts = "--import-mode=importlib -m 'not live'"
markers = [
    # Costs money and needs a key. Opt in with `-m live`; the rest of the suite
    # runs against the scripted extractor and never reaches the network.
    "live: exercises the real Anthropic API",
]
testpaths = ["tests"]
