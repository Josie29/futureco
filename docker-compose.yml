services:
  neo4j:
    image: neo4j:5-community
    ports:
      # Override in .env when another local Neo4j already holds the defaults.
      - "${NEO4J_HTTP_PORT:-7474}:7474" # Browser
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/futureco-local
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "futureco-local", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Run traces and plan-run lineage. Chosen in docs/tech-stack.md over Langfuse,
  # LangSmith and Jaeger for one reason: no account, no second key, and no free
  # tier that can lapse between submission and review.
  postgres:
    image: postgres:17-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: futureco
      POSTGRES_PASSWORD: futureco-local
      POSTGRES_DB: futureco
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futureco -d futureco"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Builds both knowledge graphs, then exits. Every write is a MERGE, so a
  # second `docker compose up` converges rather than duplicating.
  seed:
    build: &backend-build
      context: .
      dockerfile: backend/Dockerfile
    image: futureco-backend
    # Compose builds a named image only when it is *absent*, so a tree that has
    # moved on since the last build seeds the graph from stale code and every
    # symptom points somewhere else — ten SKOS assertions failing on properties
    # the build writes, on a build that predates them. `build` rebuilds on every
    # `up`, which the layer cache makes free when nothing has changed. A cold
    # clone is unaffected: it had to build anyway.
    pull_policy: build
    command: ["python", "-m", "graph.build.main"]
    environment: &backend-env
      # Container-to-container, so the service name and the in-container port,
      # not the host mapping above.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: futureco-local
    depends_on:
      neo4j:
        condition: service_healthy

  api:
    build: *backend-build
    image: futureco-backend
    pull_policy: build
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql://futureco:futureco-local@postgres:5432/futureco
      # Optional. Absent, the deterministic half of the system still serves.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  neo4j-data:
  postgres-data:
